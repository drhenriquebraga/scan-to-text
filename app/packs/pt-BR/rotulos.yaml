# Tratamentos profissionais. Valor que começa com um deles não é paciente; no
# meio do valor, encerram o nome.
prefixos_profissionais: [Dr., Dra., Dr(a)., Doutor, Doutora, Prof., Profa.]

# Registros de conselho profissional. Aceitam a UF colada ou separada
# ("CRM-SP", "CRMSP").
conselhos: [CRM, CRBM, CRF, CRO, COREN, CRN, CRP, CREFITO, CRBio, CRFa, CRTR, CRMV, RQE]

nascimento:
  rotulos:
    - Data de nascimento
    - Data de nasc.
    - Data nasc.
    - Dt. nasc.
    - Dt. de nascimento
    - DN
    - D.N.
    - D.Nasc.
    - Nasc.
    - Nascimento
  # Rótulos que também são sobrenome comum: só valem com dois-pontos, no
  # começo da linha ou depois de um vão.
  ambiguos: [Nascimento]
  # Ordem dos números na data: dma (dia, mês, ano) ou mda.
  ordem: dma
  # Ano com dois dígitos: até o pivô é 20aa; acima, 19aa.
  pivo_seculo: 30

# Partículas opcionais na comparação de nomes.
particulas: [da, de, do, dos, das, e]

# Abreviações que fazem parte do nome. Fora delas, palavra de duas letras ou
# mais terminada em ponto encerra o nome (fim de frase ou rótulo abreviado).
# O sufixo fica sempre: é ele que separa pai e filho homônimos.
abreviacoes_de_nome: [Jr., Sto., Sta.]

# Primeiros nomes comuns que, seguidos de "sobrenome" de até 2 letras, indicam
