# Rótulos de outros campos do cabeçalho. Encerram o valor do nome
# ("Paciente: X  Idade: 54" dá X). Nenhum deles é sobrenome comum. O leitor
# junta as caixas da linha com um espaço só, então o vão quase nunca separa os
# campos: o nome acaba no rótulo desta lista, numa palavra seguida de
# dois-pontos ou numa palavra abreviada seguida de número.
# Expressões em que a palavra de um rótulo negativo é adjetivo: título de
# documento ou nome de convênio, e não campo de outra pessoa. Rótulo negativo
# dentro delas não encerra nem recusa nada. Título de bloco de profissional
# ("DADOS DO MÉDICO", "Equipe médica", "Auditoria médica", "Perícia médica",
# "Clínica médica", "Orientação médica") não entra: ali a palavra abre o bloco
# do médico, e o "Nome:" vizinho é o dele.
negativos_adjetivos:
  - Receita médica
  - Receituário médico
  - Relatório médico
  - Laudo médico
  - Atestado médico
  - Parecer médico
  - Pedido médico
