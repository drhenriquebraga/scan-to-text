# Rótulos de identificação do paciente.
#
# Os valores estão como impressos nos documentos. O motor compara sem acento e
# sem distinguir maiúsculas; o ponto no fim de um rótulo abreviado é opcional,
# porque o OCR o perde. Palavras que o YAML 1.1 lê como booleano ("no", "on")
# ficam entre aspas.

paciente:
  # Rótulos que só servem ao paciente. A chave é o código gravado em
  # Candidato.rotulo; "nome_social" é o único código de nome social.
  especificos:
    paciente: [Paciente, Pcte., Pac., Nome do paciente, Nome da paciente, Nome do(a) paciente]
    nome_civil: [Nome civil]
    beneficiario: [Beneficiário, Beneficiária, Nome do beneficiário, Nome da beneficiária]
    nome_social: [Nome social]
  # Rótulos que também aparecem para outras pessoas (médico, mãe, responsável).
  # O valor é recusado quando há rótulo negativo sem nome próprio, ou registro
  # de conselho, na mesma linha ou na vizinha.
  genericos:
    nome: [Nome, Nome completo]
    cliente: [Cliente]
    tratamento: [Sr., Sra., Sr(a)., Srta.]
  # Códigos que valem no meio da frase, sem dois-pontos ("Encaminho a Sra. ...").
  em_qualquer_posicao: [tratamento]

# Rótulos de outras pessoas. Encerram o valor do paciente e, sem nome próprio
# ao lado, recusam o valor de rótulo genérico vizinho.
negativos:
