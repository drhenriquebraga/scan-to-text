# Categorias do documento. Lido por
# scan_to_text.entender.classificar.
#
# Os termos são comparados como palavras inteiras, sem acento, sem caixa, com
# hífen e travessão trocados por espaço e espaços repetidos colapsados; cada
# termo aceita o plural em "s" ou "es" (plural irregular vai escrito).
#
# A ordem de decisão:
#   1. exclusoes_titulo, em qualquer posição do título achado pela
#      segmentação; nas outras linhas de título e de seção da 1ª página, em
#      qualquer posição quando o título não casa com nenhuma regra, e só
#      abrindo a linha quando casa ("DADOS DA SOLICITAÇÃO" é um quadro do
#      resultado; "SOLICITAÇÃO DE PET-CT" é o documento);
#   2. exclusoes_texto sem `tira_de`, em todo o texto do documento;
#   3. regras, primeiro no título achado pela segmentação, depois nas linhas
#      de título e de seção da 1ª página; dentro de cada uma, a primeira regra
#      da lista que casa vence;
#   4. estrutura, em todo o texto;
#   5. na dúvida, 5;
#   6. exclusoes_texto com `tira_de`, em todo o texto: mandam para 5 só o
#      documento que caiu numa das categorias listadas.
# A linha igual à instituição do documento nunca conta como título.

# Não são resultado: pedido, solicitação, requisição, guia e autorização vão
# para 5 mesmo com nome de exame no título.
exclusoes_titulo:
  - id: guia
    termos: [guia, tiss, sp/sadt, sadt, apac, aih]
  - id: pedido
    termos: [pedido, solicitação, solicitações, requisição, requisições]
  - id: autorizacao
    termos: [autorização, autorizações]

# No corpo, só marcas fortes: "Guia: 123", "Nº do pedido" e "Médico
# solicitante" aparecem no cabeçalho de resultado e não bastam.
exclusoes_texto:
  - id: guia
    termos:
      - sp/sadt
      - tiss
      - registro ans
      - guia de serviço profissional
      - serviço auxiliar de diagnóstico e terapia
      - número da guia no prestador
      - guia de consulta
      - guia de solicitação
      - guia de internação
      - guia de honorários
      - apac
      - autorização de procedimento ambulatorial
      - laudo para solicitação
  - id: pedido
    termos:
      - pedido de exame
      - solicitação de exame
      - solicitações de exame
      - requisição de exame
      - requisições de exame
      - solicito a realização
      - solicito realização
      - favor realizar
  # O verbo de quem pede, no pedido em formato de receituário ("Solicito:",
  # "Peço a realização de"). Encaminhamento e parecer também o usam
  # ("solicito avaliação") e não são resultado: por isso a marca só tira das
  # categorias de resultado. "Solicitante" e "solicitado" não casam.
  - id: pedido_receituario
    tira_de: [2, 3, 4]
    termos:
      - solicito
      - solicitamos
      - peço

regras:
