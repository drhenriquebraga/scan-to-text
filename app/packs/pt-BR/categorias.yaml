  # vem antes dos exames: "descrição cirúrgica - biópsia" é o relato do
  # cirurgião, não o anatomopatológico. Só expressões de documento: o nome
  # da modalidade solto fica em tratamento_oncologico, depois dos exames.
  - id: tratamento_anterior
    categoria: 1
    termos:
      - resumo de tratamento
      - descrição cirúrgica
      - descrição da cirurgia
