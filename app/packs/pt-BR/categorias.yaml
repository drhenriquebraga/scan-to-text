# Estrutura, em todo o texto, quando nenhum título decidiu: cada grupo de
# `todos` precisa de pelo menos um termo presente.
estrutura:
  - id: anatomopatologico_estrutura
    categoria: 4
    todos:
      - [macroscopia, macroscópico, exame macroscópico, descrição macroscópica]
      - [microscopia, microscópico, exame microscópico, descrição microscópica]
  - id: laboratorio_estrutura
    categoria: 3
    todos:
      - [valores de referência, valor de referência, intervalo de referência, faixa de referência, vr]
      - [material, método, amostra]
