<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="titulo desc">
  <title id="titulo">How Scan-to-Text works</title>
  <desc id="desc">The scanner folder, read-only, feeds Scan-to-Text on the reception workstation, which reads, splits, identifies, classifies and dates each document offline, and writes one folder per patient with five categories, the originals and a complete history.</desc>
  <defs>
    <linearGradient id="marca" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset=".48" stop-color="#3DD9F0"/>
      <stop offset="1" stop-color="#9D8BFF"/>
    </linearGradient>
    <marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#4DA3FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7}
      .m{font-family:Consolas,Menlo,'Courier New',monospace;fill:#a3b1c6;font-size:14px}
      .tit{font-size:17px;font-weight:600}
      .sub{font-size:13px;fill:#a3b1c6}
      .etapa{font-size:14px;fill:#e6edf7}
      .caixa{fill:#0c1322;stroke:#2a3a55;stroke-width:1.2}
      .pasta{fill:none;stroke:#72829b;stroke-width:1.4;stroke-linejoin:round}
      .arq{fill:none;stroke:#72829b;stroke-width:1.3;stroke-linejoin:round}
      .seta{fill:none;stroke:#4DA3FF;stroke-width:2;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="440" rx="18" fill="#060d1a"/>

  <!-- origem -->
  <rect class="caixa" x="32" y="70" width="300" height="300" rx="12"/>
  <text class="t tit" x="56" y="106">Scanner folder</text>
  <text class="t sub" x="56" y="128">read-only: nothing is written there</text>
  <g transform="translate(56 156)">
    <path class="pasta" d="M0 6a3 3 0 0 1 3-3h7l3 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z"/>
    <text class="m" x="40" y="19">\\server\scanner</text>
  </g>
  <g transform="translate(84 200)">
    <path class="arq" d="M0 0h13l5 5v17H0z"/><text class="m" x="30" y="17">scan0001.pdf</text>
  </g>
  <g transform="translate(84 236)">
    <path class="arq" d="M0 0h13l5 5v17H0z"/><text class="m" x="30" y="17">scan0002.pdf</text>
  </g>
  <g transform="translate(84 272)">
    <path class="arq" d="M0 0h13l5 5v17H0z"/><text class="m" x="30" y="17">IMG_0417.HEIC</text>
  </g>
  <g transform="translate(84 308)">
    <path class="arq" d="M0 0h13l5 5v17H0z"/><text class="m" x="30" y="17">exames.zip</text>
  </g>

  <path class="seta" d="M342 220H418" marker-end="url(#ponta)"/>

  <!-- o app -->
  <rect x="430" y="70" width="340" height="300" rx="12" fill="#0f1729" stroke="#4DA3FF" stroke-width="1.4"/>
  <text class="t" x="456" y="108" font-size="20" font-weight="700" letter-spacing="-.4">radioterapia<tspan fill="url(#marca)">.ai</tspan></text>
  <text class="t" x="456" y="128" font-size="11" fill="#72829b" letter-spacing="3">SCAN-TO-TEXT</text>
  <text class="t sub" x="456" y="156">on the workstation, offline</text>
  <g class="t etapa">
    <circle cx="462" cy="192" r="3.5" fill="#4DA3FF"/><text x="478" y="197">reads: text layer or OCR, pages straightened</text>
    <circle cx="462" cy="224" r="3.5" fill="#4DA3FF"/><text x="478" y="229">splits piles into documents, any order</text>
    <circle cx="462" cy="256" r="3.5" fill="#4DA3FF"/><text x="478" y="261">finds the patient by the printed label</text>
    <circle cx="462" cy="288" r="3.5" fill="#4DA3FF"/><text x="478" y="293">classifies and dates each document</text>
    <circle cx="462" cy="320" r="3.5" fill="#4DA3FF"/><text x="478" y="325">transcribes literally, flags numbers</text>
  </g>

  <path class="seta" d="M780 220H856" marker-end="url(#ponta)"/>

  <!-- destino -->
  <rect class="caixa" x="868" y="70" width="300" height="300" rx="12"/>
  <text class="t tit" x="892" y="106">One folder per patient</text>
  <text class="t sub" x="892" y="128">category, date, original next to it</text>
  <g transform="translate(892 150)">
    <path class="pasta" d="M0 6a3 3 0 0 1 3-3h7l3 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z"/>
    <text class="m" x="38" y="19" fill="#e6edf7">FULANA DE TESTE</text>
  </g>
  <g class="m">
    <text x="906" y="204">├ 1 RELATORIOS MEDICOS…</text>
    <text x="906" y="228">├ 2 EXAMES DE IMAGEM…</text>
    <text x="906" y="252">├ 3 LABORATORIO</text>
    <text x="906" y="276">│ └ 2026-04-02 - HEMOGRAMA.md</text>
    <text x="906" y="300">├ 4 ANATOMOPATOLOGICO…</text>
    <text x="906" y="324">├ ORIGINAIS</text>
    <text x="906" y="348" fill="#e6edf7">└ COMPLETO.md</text>
  </g>

  <text class="t sub" x="600" y="410" text-anchor="middle">No one in the loop. No internet. When the patient is unclear, the document goes to DESCONHECIDO, still transcribed.</text>
</svg>
